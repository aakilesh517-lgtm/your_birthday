<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>30 Days Until Your Birthday ✨</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
<main class="intro-page page-shell">
  <div class="moon-bg"></div>
  <div class="intro-overlay"></div>
  <div class="stars" aria-hidden="true"></div>
  <div class="shooting-stars" aria-hidden="true"></div>

  <section class="intro-content">
    <div class="eyebrow">A LITTLE JOURNEY • 30 CHAPTERS</div>
    <h1 id="introTitle"></h1>
    <p id="introSubtitle"></p>

    <div class="countdown-card" id="prestartCard">
      <span class="countdown-label">THE JOURNEY BEGINS IN</span>
      <strong id="journeyCountdown">--</strong>
      <small>Indian Standard Time</small>
    </div>

    <button class="gold-button" id="beginBtn">
      <span>Begin The Journey</span><i>✦</i>
    </button>

    <p class="already-started" id="alreadyStarted" hidden>
      The journey has already begun. Your next chapter is waiting.
    </p>
  </section>
</main>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/index.js"></script>
</body>
</html>
