<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>30 Chapters — Your Journey</title>
<link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/chapters.css">
</head>
<body>
<main class="board-page page-shell">
  <header class="board-header">
    <div>
      <div class="eyebrow">THE JOURNEY</div>
      <h1>30 Chapters, One Story</h1>
    </div>
    <a class="home-link" href="index.html">↶ Intro</a>
  </header>

  <section class="status-panel">
    <div class="status-copy">
      <span id="statusKicker">YOUR NEXT CHAPTER</span>
      <strong id="statusTitle">Loading...</strong>
      <small id="statusDetail"></small>
    </div>
    <div class="main-timer">
      <span id="timerLabel">COUNTDOWN</span>
      <strong id="mainTimer">--</strong>
    </div>
  </section>

  <div class="birthday-banner" id="birthdayBanner" hidden>
    <div class="boom">🎂</div>
    <div><strong>HAPPY BIRTHDAY</strong><span>13 September • The final chapter is here.</span></div>
  </div>

  <section class="chapter-board" id="chapterBoard" aria-label="30 chapter board"></section>

  
</main>
<script src="js/config.js"></script><script src="js/utils.js"></script><script src="js/chapters.js"></script>
</body>
</html>
